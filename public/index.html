<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Finance · Bitrix24</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#778196;--line:#e6eaf0;--accent:#2563eb;--green:#15966a;--red:#d94b5b;--shadow:0 10px 30px #18243a0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;justify-content:space-between;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:18px;display:flex;gap:10px;align-items:center}.logo{width:34px;height:34px;border-radius:10px;background:#2563eb;color:white;display:grid;place-items:center;font-weight:900}.user{display:flex;align-items:center;gap:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e8eefc;display:grid;place-items:center;font-weight:700;color:#2563eb}.layout{display:grid;grid-template-columns:240px 1fr;max-width:1500px;margin:auto}.side{padding:24px 16px;border-right:1px solid var(--line);min-height:calc(100vh - 68px)}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:9px;color:#657086;margin-bottom:3px}.nav button.active,.nav button:hover{background:#eaf0ff;color:#1f5bd6}.content{padding:28px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:16px}.pagehead h1{font-size:26px;margin:0 0 4px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.metric{font-size:24px;font-weight:800;margin-top:6px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--accent)}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.project{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.15s}.project:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.project h3{margin:0 0 5px}.projectnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.projectnums b{display:block;margin-top:3px}.tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted);font-weight:600;background:#fbfcfe}.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px;background:#eef2f7}.badge.green{background:#e8f7f0}.badge.red{background:#fff0f1}.badge.blue{background:#edf3ff}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}.modalback{position:fixed;inset:0;background:#18243a55;display:grid;place-items:center;z-index:20;padding:18px}.modal{background:#fff;border-radius:16px;width:min(560px,100%);padding:22px;box-shadow:0 30px 80px #18243a30}.modal h2{margin:0 0 18px}.form{display:grid;gap:12px}.form label{display:grid;gap:5px;color:#5e687b;font-size:13px}.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:none}.form input:focus,.form select:focus,.form textarea:focus{border-color:#7ca3ff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.detailhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.break{display:grid;gap:10px}.barline{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center}.bar{height:8px;background:#edf1f6;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb;border-radius:8px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--accent);border-color:var(--accent)}.empty{text-align:center;padding:42px;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#f7f9fd,#edf3ff)}.loginbox{width:min(410px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}.loginbox h1{margin:0 0 5px}.notice{background:#fff8df;border:1px solid #f2dda0;padding:10px;border-radius:9px;font-size:12px;margin-top:14px}.error{color:var(--red);min-height:20px}.sectiontitle{font-size:16px;font-weight:750;margin:4px 0 12px}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.project-grid{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:700px){.layout{display:block}.side{display:none}.content{padding:18px}.top{padding:0 16px}.cards,.project-grid{grid-template-columns:1fr}.pagehead,.detailhead{align-items:stretch;flex-direction:column}}
</style></head><body><div id="root"></div><script>
const $=s=>document.querySelector(s), root=$('#root');let state={token:localStorage.getItem('pf_token'),user:null,projects:[],categories:[],users:[],view:'dashboard',project:null,tab:'overview'};
const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(state.token?{Authorization:'Bearer '+state.token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch('/api'+url,opt);const d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error(d.error||'Авторизация');}if(!r.ok)throw Error(d.error||'Ошибка');return d}
function login(){root.innerHTML=`<div class="login"><div class="loginbox"><div class="brand"><div class="logo">₽</div>Project Finance</div><h1 style="margin-top:24px">Вход в систему</h1><p class="muted">Учет финансов проектов внутри Bitrix24</p><form class="form" id="loginForm"><label>Email<input name="email" type="email" required value="admin@example.com"></label><label>Пароль<input name="password" type="password" required></label><div class="error" id="err"></div><button class="btn primary">Войти</button></form><div class="notice">Первый запуск: admin@example.com / admin123. Обязательно задайте свои ADMIN_EMAIL и ADMIN_PASSWORD в окружении.</div></div></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api('/auth/login',{method:'POST',body:Object.fromEntries(f)});state.token=d.token;localStorage.setItem('pf_token',d.token);await boot()}catch(x){$('#err').textContent=x.message}}}
async function boot(){try{state.user=await api('/me');state.categories=await api('/categories');state.users=await api('/users');await render()}catch(e){login()}}
function shell(){return `<div class="app"><header class="top"><div class="brand"><div class="logo">₽</div>Project Finance</div><div class="user"><div><b>${esc(state.user.name)}</b><div class="muted" style="font-size:11px">${state.user.role==='admin'?'Администратор':'Сотрудник'}</div></div><div class="avatar">${esc(state.user.name[0])}</div><button class="btn" onclick="logout()">Выйти</button></div></header><div class="layout"><aside class="side"><div class="nav"><button class="${state.view==='dashboard'?'active':''}" onclick="go('dashboard')">▦ &nbsp; Обзор</button><button class="${state.view==='projects'?'active':''}" onclick="go('projects')">◫ &nbsp; Проекты</button>${state.user.role==='admin'?`<button class="${state.view==='settings'?'active':''}" onclick="go('settings')">⚙ &nbsp; Настройки</button>`:''}</div><div style="margin-top:30px;font-size:12px;color:var(--muted)">Проекты</div><div style="margin-top:8px">${state.projects.slice(0,8).map(p=>`<button class="nav" style="width:100%;border:0;background:none;text-align:left;padding:8px 5px;color:#69758a" onclick="openProject(${p.id})">${esc(p.name)}</button>`).join('')}</div></aside><main class="content" id="content"></main></div></div>`}
async function render(){state.projects=await api('/projects');root.innerHTML=shell();if(state.view==='dashboard')dashboard();else if(state.view==='projects')projects();else settings()}
function dashboard(){const p=state.projects, income=p.reduce((a,x)=>a+x.income,0), expense=p.reduce((a,x)=>a+x.expense,0);$('#content').innerHTML=`<div class="pagehead"><div><h1>Финансовый обзор</h1><div class="muted">Сводка по всем доступным проектам</div></div><button class="btn primary" onclick="newProject()">+ Новый проект</button></div><div class="cards"><div class="card"><div class="muted">Доход</div><div class="metric green">${money(income)}</div></div><div class="card"><div class="muted">Расходы</div><div class="metric red">${money(expense)}</div></div><div class="card"><div class="muted">Прибыль</div><div class="metric blue">${money(income-expense)}</div></div><div class="card"><div class="muted">Рентабельность</div><div class="metric">${income?(100*(income-expense)/income).toFixed(1):'0.0'}%</div></div></div><div class="pagehead"><div><h2 style="margin:0">Проекты</h2></div><button class="btn" onclick="go('projects')">Все проекты →</button></div>${p.length?`<div class="project-grid">${p.map(projectCard).join('')}</div>`:`<div class="card empty">Проектов пока нет.<br><button class="btn primary" style="margin-top:12px" onclick="newProject()">Создать первый проект</button></div>`}`}
function projectCard(p){return `<div class="project" onclick="openProject(${p.id})"><div style="display:flex;justify-content:space-between;gap:10px"><div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.description||'Без описания')}</div></div><span class="badge ${p.status==='active'?'green':''}">${p.status==='active'?'Активен':'Архив'}</span></div><div class="projectnums"><div><span class="muted">Доход</span><b class="green">${money(p.income)}</b></div><div><span class="muted">Расход</span><b class="red">${money(p.expense)}</b></div><div><span class="muted">Прибыль</span><b class="blue">${money(p.profit)}</b></div></div><div style="margin-top:15px" class="muted">Рентабельность: <b style="color:var(--text)">${p.margin.toFixed(1)}%</b></div></div>`}
function projects(){const rows=state.projects;$('#content').innerHTML=`<div class="pagehead"><div><h1>Проекты</h1><div class="muted">Сравнение экономической эффективности</div></div><button class="btn primary" onclick="newProject()">+ Новый проект</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Проект</th><th>Статус</th><th>Доход</th><th>Расходы</th><th>Прибыль</th><th>Рентабельность</th></tr></thead><tbody>${rows.length?rows.map(p=>`<tr onclick="openProject(${p.id})" style="cursor:pointer"><td><b>${esc(p.name)}</b><div class="muted">${esc(p.description||'')}</div></td><td><span class="badge ${p.status==='active'?'green':''}">${p.status==='active'?'Активен':'Архив'}</span></td><td class="green">${money(p.income)}</td><td class="red">${money(p.expense)}</td><td><b>${money(p.profit)}</b></td><td>${p.margin.toFixed(1)}%</td></tr>`).join(''):`<tr><td colspan="6" class="empty">Нет проектов</td></tr>`}</tbody></table></div>`}
async function openProject(id){state.project=await api('/projects/'+id);state.view='detail';state.tab='overview';root.innerHTML=shell();detail()}
function detail(){const p=state.project,m=p.metrics;$('#content').innerHTML=`<div class="detailhead"><div><button class="btn" onclick="go('projects')">← Проекты</button><h1 style="margin:16px 0 4px">${esc(p.name)}</h1><div class="muted">${esc(p.description||'')}</div></div><div style="display:flex;gap:8px"><button class="btn" onclick="editProject()">Изменить</button><button class="btn primary" onclick="newTransaction()">+ Операция</button></div></div><div class="cards"><div class="card"><div class="muted">Доход</div><div class="metric green">${money(m.income)}</div></div><div class="card"><div class="muted">Расходы</div><div class="metric red">${money(m.expense)}</div></div><div class="card"><div class="muted">Прибыль</div><div class="metric blue">${money(m.profit)}</div></div><div class="card"><div class="muted">Рентабельность</div><div class="metric">${m.margin.toFixed(1)}%</div></div></div><div class="tabs"><button class="${state.tab==='overview'?'active':''}" onclick="setTab('overview')">Обзор</button><button class="${state.tab==='transactions'?'active':''}" onclick="setTab('transactions')">Операции</button><button class="${state.tab==='team'?'active':''}" onclick="setTab('team')">Команда</button></div><div id="detailtab"></div>`;setTab(state.tab)}
function setTab(t){state.tab=t;document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',['overview','transactions','team'][i]===t));const el=$('#detailtab');if(t==='overview')el.innerHTML=`<div class="grid"><div class="card"><div class="sectiontitle">Последние операции</div>${state.project.transactions.slice(0,7).map(tx=>txrow(tx,false)).join('')||'<div class="empty">Операций пока нет</div>'}</div><div class="card"><div class="sectiontitle">Расходы по статьям</div><div class="break">${state.project.breakdown.length?state.project.breakdown.map(x=>{const max=state.project.breakdown[0].amount;return `<div class="barline"><span>${esc(x.name)}</span><div class="bar"><i style="width:${100*x.amount/max}%"></i></div><b>${money(x.amount)}</b></div>`}).join(''):'<div class="empty">Нет расходов</div>'}</div></div></div>`;else if(t==='transactions')el.innerHTML=`<div class="toolbar"><button class="btn primary" onclick="newTransaction()">+ Добавить операцию</button><button class="btn" onclick="newCategory('expense')">+ Статья расхода</button><button class="btn" onclick="newCategory('income')">+ Статья дохода</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Дата</th><th>Тип</th><th>Статья</th><th>Сумма</th><th>Комментарий</th><th></th></tr></thead><tbody>${state.project.transactions.map(tx=>txrow(tx,true)).join('')||'<tr><td colspan="6" class="empty">Нет операций</td></tr>'}</tbody></table></div>`;else el.innerHTML=`<div class="card"><div class="pagehead"><div><div class="sectiontitle">Участники проекта</div><div class="muted">Сотрудники, которые имеют доступ к финансовым данным проекта</div></div><button class="btn primary" onclick="addMember()">+ Добавить сотрудника</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Сотрудник</th><th>Email</th><th>Роль</th><th></th></tr></thead><tbody>${state.project.members.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td><span class="badge ${u.role==='manager'?'blue':''}">${u.role==='manager'?'Менеджер':'Участник'}</span></td><td><button class="btn danger" onclick="removeMember(${u.id})">Удалить</button></td></tr>`).join('')}</tbody></table></div></div>`}
function txrow(t,full){return full?`<tr><td>${esc(t.transaction_date)}</td><td><span class="badge ${t.type==='income'?'green':'red'}">${t.type==='income'?'Доход':'Расход'}</span></td><td>${esc(t.category)}</td><td class="${t.type==='income'?'green':'red'}"><b>${t.type==='income'?'+':'−'} ${money(t.amount)}</b></td><td>${esc(t.description)}</td><td><button class="btn" onclick="editTransaction(${t.id})">Изменить</button> <button class="btn danger" onclick="deleteTransaction(${t.id})">×</button></td></tr>`:`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${esc(t.category)}</b><div class="muted">${esc(t.transaction_date)} · ${esc(t.description||'')}</div></div><b class="${t.type==='income'?'green':'red'}">${t.type==='income'?'+':'−'}${money(t.amount)}</b></div>`}
function modal(title,body){const d=document.createElement('div');d.className='modalback';d.innerHTML=`<div class="modal"><h2>${title}</h2>${body}</div>`;document.body.appendChild(d);return d}
function close(m){m.remove()}
function newProject(){const m=modal('Новый проект',`<form class="form" id="pf"><label>Название<input name="name" required></label><label>Описание<textarea name="description" rows="3"></textarea></label><label>Статус<select name="status"><option value="active">Активен</option><option value="archived">Архив</option></select></label><label>ID группы Bitrix24 (необязательно)<input name="bitrix_group_id"></label><div class="actions"><button type="button" class="btn" onclick="close(this.closest('.modalback'))">Отмена</button><button class="btn primary">Создать</button></div></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await api('/projects',{method:'POST',body:Object.fromEntries(new FormData(e.target))});close(m);await render()}catch(x){alert(x.message)}}}
function editProject(){const p=state.project,m=modal('Изменить проект',`<form class="form" id="ef"><label>Название<input name="name" required value="${esc(p.name)}"></label><label>Описание<textarea name="description" rows="3">${esc(p.description)}</textarea></label><label>Статус<select name="status"><option value="active" ${p.status==='active'?'selected':''}>Активен</option><option value="archived" ${p.status==='archived'?'selected':''}>Архив</option></select></label><label>ID группы Bitrix24<input name="bitrix_group_id" value="${esc(p.bitrix_group_id||'')}"></label><div class="actions"><button type="button" class="btn" onclick="close(this.closest('.modalback'))">Отмена</button><button class="btn primary">Сохранить</button></div></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await api('/projects/'+p.id,{method:'PUT',body:Object.fromEntries(new FormData(e.target))});close(m);await openProject(p.id)}catch(x){alert(x.message)}}}
function newTransaction(existing){const t=existing||{},m=modal(existing?'Изменить операцию':'Новая операция',`<form class="form" id="tf"><label>Тип<select name="type" id="tt"><option value="income" ${t.type==='income'?'selected':''}>Доход</option><option value="expense" ${t.type==='expense'?'selected':''}>Расход</option></select></label><label>Статья<select name="category_id" id="tc"></select></label><label>Сумма<input name="amount" type="number" min="0.01" step="0.01" required value="${t.amount||''}"></label><label>Дата<input name="transaction_date" type="date" required value="${t.transaction_date||new Date().toISOString().slice(0,10)}"></label><label>Комментарий<textarea name="description" rows="2">${esc(t.description||'')}</textarea></label><div class="actions"><button type="button" class="btn" onclick="close(this.closest('.modalback'))">Отмена</button><button class="btn primary">Сохранить</button></div></form>`);const tc=m.querySelector('#tc'),tt=m.querySelector('#tt');function cats(){tc.innerHTML=state.categories.filter(c=>c.type===tt.value).map(c=>`<option value="${c.id}" ${String(c.id)===String(t.category_id)?'selected':''}>${esc(c.name)}</option>`).join('')}tt.onchange=cats;cats();m.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const body=Object.fromEntries(new FormData(e.target));body.category_id=Number(body.category_id);body.amount=Number(body.amount);if(existing)await api('/transactions/'+existing.id,{method:'PUT',body});else await api('/projects/'+state.project.id+'/transactions',{method:'POST',body});close(m);await openProject(state.project.id);state.tab='transactions';setTab('transactions')}catch(x){alert(x.message)}}}
function editTransaction(id){const t=state.project.transactions.find(x=>x.id===id);newTransaction(t)}
async function deleteTransaction(id){if(!confirm('Удалить операцию?'))return;try{await api('/transactions/'+id,{method:'DELETE'});await openProject(state.project.id);state.tab='transactions';setTab('transactions')}catch(x){alert(x.message)}}
function newCategory(type){const m=modal(type==='income'?'Новая статья дохода':'Новая статья расхода',`<form class="form" id="cf"><label>Название<input name="name" required placeholder="Например: Лицензии"></label><div class="actions"><button type="button" class="btn" onclick="close(this.closest('.modalback'))">Отмена</button><button class="btn primary">Добавить</button></div></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await api('/categories',{method:'POST',body:{type,name:new FormData(e.target).get('name')}});state.categories=await api('/categories');close(m)}catch(x){alert(x.message)}}}
function addMember(){if(state.user.role!=='admin'&&!state.project.members.some(x=>x.id===state.user.id&&x.role==='manager'))return alert('Недостаточно прав');const m=modal('Добавить сотрудника',`<form class="form" id="mf"><label>Сотрудник<select name="user_id">${state.users.filter(u=>!state.project.members.some(x=>x.id===u.id)).map(u=>`<option value="${u.id}">${esc(u.name)} · ${esc(u.email)}</option>`).join('')}</select></label><label>Роль<select name="role"><option value="member">Участник</option><option value="manager">Менеджер</option></select></label><div class="actions"><button type="button" class="btn" onclick="close(this.closest('.modalback'))">Отмена</button><button class="btn primary">Добавить</button></div></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const b=Object.fromEntries(new FormData(e.target));b.user_id=Number(b.user_id);await api('/projects/'+state.project.id+'/members',{method:'POST',body:b});close(m);await openProject(state.project.id);state.tab='team';setTab('team')}catch(x){alert(x.message)}}}
async function removeMember(id){if(!confirm('Удалить сотрудника из проекта?'))return;try{await api('/projects/'+state.project.id+'/members/'+id,{method:'DELETE'});await openProject(state.project.id);state.tab='team';setTab('team')}catch(x){alert(x.message)}}
function settings(){if(state.user.role!=='admin')return go('dashboard');$('#content').innerHTML=`<div class="pagehead"><div><h1>Настройки</h1><div class="muted">Сотрудники и статьи доходов/расходов</div></div><button class="btn primary" onclick="newUser()">+ Добавить сотрудника</button></div><div class="grid"><div class="card"><div class="sectiontitle">Сотрудники</div><div class="tablewrap"><table class="table"><thead><tr><th>Имя</th><th>Email</th><th>Роль</th></tr></thead><tbody>${state.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role==='admin'?'Администратор':'Сотрудник'}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="sectiontitle">Статьи</div>${state.categories.map(c=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><span class="badge ${c.type==='income'?'green':'red'}">${c.type==='income'?'Доход':'Расход'}</span> ${esc(c.name)}</div>`).join('')}<button class="btn" style="margin-top:12px" onclick="newCategory('expense')">+ Добавить статью</button></div></div>`}
function newUser(){const m=modal('Новый сотрудник',`<form class="form" id="uf"><label>Имя<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Пароль<input name="password" type="password" required minlength="6"></label><label>Роль<select name="role"><option value="member">Сотрудник</option><option value="admin">Администратор</option></select></label><div class="actions"><button type="button" class="btn" onclick="close(this.closest('.modalback'))">Отмена</button><button class="btn primary">Создать</button></div></form>`);m.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await api('/users',{method:'POST',body:Object.fromEntries(new FormData(e.target))});close(m);state.users=await api('/users');settings()}catch(x){alert(x.message)}}}
function go(v){state.view=v;render()}async function logout(){if(state.token)await api('/auth/logout').catch(()=>{});localStorage.removeItem('pf_token');state.token=null;login()}
if(state.token)boot();else login();
</script></body></html>
