<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Финансы проектов · Bitrix24</title><style>:root{--bg:#f5f7fa;--card:#fff;--line:#e6e9ee;--text:#20252b;--muted:#8a939f;--blue:#2f80ed;--blue2:#eaf3ff;--green:#19a974;--red:#e05260}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,sans-serif}.head{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;justify-content:space-between}.brand{font-size:16px;font-weight:700}.sub{color:var(--muted);font-size:12px}.wrap{max-width:1440px;margin:auto;padding:22px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:18px}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:6px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.label{color:var(--muted);font-size:12px}.value{font-size:23px;font-weight:700;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.panel{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.panel h2{font-size:16px;margin:0;padding:16px;border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse}th,td{padding:12px 15px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc}.status{padding:4px 8px;border-radius:12px;background:#edf1f5;font-size:12px}.status.ok{background:#e8f8f1;color:#16865d}.notice{padding:18px;color:var(--muted)}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}}@media(max-width:520px){.cards{grid-template-columns:1fr}}</style></head><body><header class="head"><div><div class="brand">Финансы проектов</div><div class="sub">Bitrix24</div></div><div id="portal" class="sub">Подключение…</div></header><main class="wrap"><div class="toolbar"><div><b>Экономическая эффективность</b><div class="sub">Доходы, расходы, прибыль и рентабельность</div></div><button class="btn primary" id="sync">Синхронизировать проекты</button></div><section class="cards"><div class="card"><div class="label">Доход</div><div class="value green" id="income">—</div></div><div class="card"><div class="label">Расходы</div><div class="value red" id="expense">—</div></div><div class="card"><div class="label">Прибыль</div><div class="value blue" id="profit">—</div></div><div class="card"><div class="label">Рентабельность</div><div class="value" id="margin">—</div></div></section><section class="panel"><h2>Проекты Bitrix24</h2><div id="body" class="notice">Инициализация приложения…</div></section></main><script>const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(n||0));let token='';async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token};if(o.body&&!String(o.body).startsWith('{')){}const r=await fetch('/api'+u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}function draw(rows){document.querySelector('#body').innerHTML=rows.length?`<table><thead><tr><th>Проект</th><th>Статус</th><th>Доход</th><th>Расходы</th><th>Прибыль</th><th>Рентабельность</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${String(p.name).replace(/[<>]/g,'')}</b><div class="sub">${p.bitrix_group_id?'Bitrix ID: '+p.bitrix_group_id:''}</div></td><td><span class="status ${p.status==='active'?'ok':''}">${p.status==='active'?'Активен':'Архив'}</span></td><td class="green">${money(p.income)}</td><td class="red">${money(p.expense)}</td><td class="blue">${money(p.profit)}</td><td>${Number(p.margin||0).toFixed(1)}%</td></tr>`).join('')}</tbody></table>`:'<div class="notice">Проекты не найдены. Нажмите «Синхронизировать проекты».</div>'}async function load(){const [p,d,c]=await Promise.all([api('/projects'),api('/dashboard'),api('/bitrix/context')]);document.querySelector('#portal').textContent=c.connected?c.connection.domain:'Bitrix24 не подключен';document.querySelector('#income').textContent=money(d.income);document.querySelector('#expense').textContent=money(d.expense);document.querySelector('#profit').textContent=money(d.profit);document.querySelector('#margin').textContent=Number(d.margin||0).toFixed(1)+'%';draw(p)}async function start(){try{if(!window.BX24){document.querySelector('#body').innerHTML='<div class="notice">Эта страница предназначена для запуска внутри Bitrix24. Для локальной разработки используйте основной интерфейс.</div>';return}BX24.init(async function(){const a=BX24.getAuth();const r=await fetch('/api/bitrix/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a)});const d=await r.json();if(!r.ok)throw Error(d.error||'OAuth error');token=d.token;await load();BX24.resizeWindow(1200,760)});}catch(e){document.querySelector('#body').innerHTML='<div class="notice">Ошибка подключения Bitrix24: '+String(e.message).replace(/[<>]/g,'')+'</div>'}}document.querySelector('#sync').onclick=async()=>{try{await api('/bitrix/sync-projects',{method:'POST'});await load()}catch(e){alert(e.message)}};start();</script></body></html>
